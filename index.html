<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القيم اليومية</title>

<style>
  /* ============ إعدادات عامة ============ */
  :root{
    --bg:#F7F7F5;
    --text:#1F2937;
    --primary:#1F6F5F;
    --primary-dark:#164f43;
    --gold:#C9A227;
    --card-bg:#FFFFFF;
    --border:#E5E5E0;
    --danger:#B94A48;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 12px;
    line-height:1.6;
  }

  /* ============ البطاقة الرئيسية ============ */
  .card{
    background:var(--card-bg);
    width:100%;
    max-width:620px;
    border-radius:18px;
    padding:28px 22px 32px;
    box-shadow:0 6px 24px rgba(0,0,0,0.06);
    border:1px solid var(--border);
  }

  header{
    text-align:center;
    margin-bottom:18px;
  }

  header h1{
    color:var(--primary-dark);
    font-size:1.7rem;
    margin-bottom:6px;
  }

  header p.subtitle{
    color:#555;
    font-size:0.95rem;
  }

  .today-date{
    text-align:center;
    color:var(--gold);
    font-weight:700;
    font-size:0.95rem;
    margin:10px 0 20px;
    background:#fbf6e6;
    border:1px solid #efe2b3;
    border-radius:10px;
    padding:8px;
  }

  /* ============ الأسئلة ============ */
  .questions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }

  .question-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    transition:background .2s, border-color .2s;
  }

  .question-item.checked{
    background:#eaf5f1;
    border-color:var(--primary);
  }

  .question-item input[type="checkbox"]{
    width:22px;
    height:22px;
    accent-color:var(--primary);
    cursor:pointer;
    flex-shrink:0;
  }

  .question-item label{
    cursor:pointer;
    font-size:1rem;
    flex:1;
  }

  .question-item .ref-text{
    display:block;
    font-size:0.78rem;
    color:#888;
    margin-top:2px;
    font-weight:400;
  }

  /* ============ كتلة كل قيمة (سؤال رئيسي + مؤشرات) ============ */
  .value-block{
    margin-bottom:14px;
  }

  .indicators-block{
    margin:8px 0 0;
    padding-inline-start:20px;
    border-inline-start:2px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .indicators-title{
    font-size:0.78rem;
    font-weight:700;
    color:var(--gold);
    margin-bottom:2px;
  }

  .indicator-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    transition:background .2s, border-color .2s;
  }

  .indicator-item.checked{
    background:#fbf6e6;
    border-color:var(--gold);
  }

  .indicator-item input[type="checkbox"]{
    width:17px;
    height:17px;
    accent-color:var(--gold);
    cursor:pointer;
    flex-shrink:0;
  }

  .indicator-item label{
    cursor:pointer;
    font-size:0.85rem;
    flex:1;
    color:#444;
  }

  /* ============ عرض النقاط ============ */
  .score-box{
    text-align:center;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
  }

  .score-box .score-value{
    font-size:2.4rem;
    font-weight:800;
  }

  .score-box .score-label{
    font-size:0.95rem;
    opacity:0.9;
    margin-top:4px;
  }

  /* ============ الأزرار ============ */
  .btn{
    display:inline-block;
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:opacity .2s, transform .1s;
  }
  .btn:active{ transform:scale(0.98); }

  .btn-primary{
    background:var(--primary);
    color:#fff;
    margin-bottom:12px;
  }
  .btn-primary:hover{ background:var(--primary-dark); }

  .small-buttons{
    display:flex;
    gap:10px;
    margin-bottom:6px;
  }

  .btn-secondary{
    background:#fff;
    color:var(--primary-dark);
    border:1.5px solid var(--primary);
    flex:1;
    font-size:0.9rem;
    padding:10px;
  }
  .btn-secondary:hover{ background:#eaf5f1; }

  .btn-danger{
    background:#fff;
    color:var(--danger);
    border:1.5px solid var(--danger);
    flex:1;
    font-size:0.9rem;
    padding:10px;
  }
  .btn-danger:hover{ background:#fbeceb; }

  /* ============ الإشعار ============ */
  #toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--primary-dark);
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-size:0.95rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:999;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ============ قسم التقدم ============ */
  .section-title{
    color:var(--primary-dark);
    font-size:1.25rem;
    margin:30px 0 14px;
    border-bottom:2px solid var(--gold);
    display:inline-block;
    padding-bottom:4px;
  }

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }

  .subsection-title{
    font-size:1rem;
    font-weight:700;
    color:var(--primary-dark);
    margin:6px 0 10px;
  }

  .value-avg-table{
    margin-bottom:20px;
  }

  .stat-card{
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }

  .stat-card .stat-value{
    font-size:1.4rem;
    font-weight:800;
    color:var(--primary-dark);
  }

  .stat-card .stat-label{
    font-size:0.8rem;
    color:#666;
    margin-top:2px;
  }

  /* ============ الرسم البياني ============ */
  canvas{
    width:100%;
    max-width:100%;
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:20px;
    display:block;
  }

  /* ============ جدول السجل ============ */
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:10px;
    font-size:0.92rem;
  }

  th, td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }

  th{
    background:#eaf5f1;
    color:var(--primary-dark);
  }

  tr:hover td{ background:#fafaf8; }

  .empty-state{
    text-align:center;
    color:#888;
    padding:16px;
    font-size:0.9rem;
  }

  footer{
    text-align:center;
    color:#999;
    font-size:0.78rem;
    margin-top:22px;
  }

  @media (max-width:480px){
    header h1{ font-size:1.4rem; }
    .score-box .score-value{ font-size:2rem; }
    .stats-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="card">

  <header>
    <h1>اختبار القيم اليومية</h1>
    <p class="subtitle">قبل أي قرار مهم أسأل نفسي:</p>
  </header>

  <!-- عرض تاريخ اليوم -->
  <div class="today-date" id="todayDate"></div>

  <!-- الأسئلة الستة -->
  <div class="questions" id="questionsContainer"></div>

  <!-- عرض النقاط -->
  <div class="score-box">
    <div class="score-value"><span id="scoreValue">0.00</span> / 10.5</div>
    <div class="score-label">نقاط اليوم</div>
  </div>

  <!-- زر الحفظ -->
  <button class="btn btn-primary" id="saveBtn">حفظ تقييم اليوم</button>

  <!-- أزرار إضافية -->
  <div class="small-buttons">
    <button class="btn btn-secondary" id="resetTodayBtn">إعادة تعيين اليوم</button>
    <button class="btn btn-danger" id="clearAllBtn">مسح جميع البيانات</button>
  </div>

  <!-- قسم التقدم -->
  <h2 class="section-title">تطوري</h2>
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-value" id="statDays">0</div>
      <div class="stat-label">إجمالي الأيام المسجلة</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTotalPoints">0</div>
      <div class="stat-label">إجمالي النقاط</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statAvg">0</div>
      <div class="stat-label">متوسط النقاط اليومي</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statBest">0</div>
      <div class="stat-label">أفضل يوم</div>
    </div>
    <div class="stat-card" style="grid-column:1 / -1;">
      <div class="stat-value" id="statFullDays">0</div>
      <div class="stat-label">عدد الأيام الكاملة (10.5/10.5)</div>
    </div>
  </div>

  <!-- تحليل متوسط كل قيمة على حدة -->
  <h3 class="subsection-title">متوسط كل قيمة</h3>
  <div id="valueAveragesContainer" class="value-avg-table"></div>

  <!-- الرسم البياني -->
  <canvas id="progressChart" height="180"></canvas>

  <!-- سجل الأيام -->
  <h2 class="section-title">سجل الأيام</h2>
  <div id="tableContainer"></div>

  <footer>يتم حفظ جميع بياناتك محليًا في متصفحك فقط.</footer>
</div>

<!-- عنصر الإشعار -->
<div id="toast"></div>

<script>
/* =========================================================
   مصفوفة القيم - كل قيمة تحتوي على:
   - title: اسم مختصر يُستخدم في جدول تحليل المتوسطات
   - question: السؤال الرئيسي (1 نقطة عند تحديده)
   - reference: مرجع اختياري يظهر تحت السؤال (يمكن حذفه)
   - indicators: 3 مؤشرات نجاح (0.25 نقطة لكل مؤشر محدد)
   يمكن إضافة/حذف/تعديل أي قيمة أو مؤشر من هنا بسهولة
   ========================================================= */
const VALUES = [
  {
    title: "يسوع هو الأول",
    question: "هل يضع هذا يسوع أولًا؟",
    reference: "",
    indicators: [
      "قضيت وقتًا حقيقيًا في كلمة الله والصلاة اليوم.",
      "اتخذت قرارًا بعد صلاة أو طلب مشورة الله.",
      "حافظت على أولوياتي الروحية قبل الانشغال بالعمل أو الناس."
    ]
  },
  {
    title: "المسؤولية",
    question: "هل أتحمل مسؤوليته كاملة؟",
    reference: "(المرجعية: 2 تيموثاوس 2:5)",
    indicators: [
      "اعترفت بخطئي بسرعة عندما أخطأت.",
      "أنجزت ما كان ضمن مسؤوليتي دون أعذار.",
      "التزمت بالطريق الصحيح والمعايير حتى عندما كان ذلك أصعب."
    ]
  },
  {
    title: "النزاهة والإتقان",
    question: "هل يعكس نزاهة وإتقانًا؟",
    reference: "",
    indicators: [
      "راجعت عملي قبل تسليمه.",
      "التزمت بالتفاصيل الصغيرة كما التزمت بالمهام الكبيرة.",
      "أنهيت ما بدأته بأفضل جودة أستطيع تقديمها."
    ]
  },
  {
    title: "الصراحة في المحبة",
    question: "هل أستطيع قوله بصراحة ومحبة؟",
    reference: "",
    indicators: [
      "تكلمت بهدوء واحترام.",
      "قلت الحقيقة بوضوح دون مبالغة أو إخفاء.",
      "واجهت الشخص المناسب مباشرة بدلًا من الكلام عنه."
    ]
  },
  {
    title: "التواضع والخدمة",
    question: "هل يخدم الناس بتواضع؟",
    reference: "",
    indicators: [
      "استمعت للآخر حتى النهاية قبل أن أرد.",
      "حاولت أن أفهم الشخص قبل أن أحكم عليه.",
      "طلبت أو قبلت المساعدة عندما احتجت إليها."
    ]
  },
  {
    title: "التعلّم والنمو",
    question: "هل يساعدني على التعلّم والنمو؟",
    reference: "",
    indicators: [
      "اعترفت بعدم معرفتي عندما لم أكن أعرف.",
      "تعلمت شيئًا جديدًا اليوم (قراءة، تدريب، خبرة، أو ملاحظة).",
      "طبقت ما تعلمته عمليًا في موقف حقيقي."
    ]
  }
];

/* =========================================================
   ثوابت نظام النقاط
   - السؤال الرئيسي = 1 نقطة
   - كل مؤشر نجاح = 0.25 نقطة
   - الحد الأقصى لكل قيمة = 1 + (3 × 0.25) = 1.75
   - الحد الأقصى الكلي = 6 × 1.75 = 10.5
   ========================================================= */
const MAIN_POINTS = 1;
const INDICATOR_POINTS = 0.25;
const MAX_PER_VALUE = MAIN_POINTS + (3 * INDICATOR_POINTS); // 1.75
const MAX_TOTAL = VALUES.length * MAX_PER_VALUE; // 10.5

const STORAGE_KEY = "dailyValuesTracker"; // مفتاح التخزين في localStorage

/* =========================================================
   أدوات مساعدة للتاريخ
   ========================================================= */

// إرجاع مفتاح اليوم بصيغة YYYY-MM-DD
function getTodayKey(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// تنسيق التاريخ بالعربية (مثل: الثلاثاء، 4 أغسطس 2026)
function formatArabicDate(date = new Date()){
  const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                   "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const dayName = days[date.getDay()];
  const monthName = months[date.getMonth()];
  return `${dayName}، ${date.getDate()} ${monthName} ${date.getFullYear()}`;
}

/* =========================================================
   إدارة التخزين المحلي (localStorage)
   شكل البيانات الجديد:
   {
     "2026-08-04": { "total": 8.5, "values": [1.75, 1, 1.5, 1, 1.25, 2] },
     "2026-08-05": { "total": 10.5, "values": [1.75, 1.75, 1.75, 1.75, 1.75, 1.75] }
   }
   (values هي نقاط كل قيمة من أصل 1.75 بنفس ترتيب مصفوفة VALUES)

   ملاحظة توافق: النسخة السابقة كانت تخزن رقمًا بسيطًا لكل يوم
   (مثل "2026-08-03": 5). دالة normalizeEntry تتعامل مع الحالتين.
   ========================================================= */

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    console.error("خطأ في قراءة البيانات المحفوظة:", e);
    return {};
  }
}

function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// توحيد صيغة يوم واحد، مع دعم الصيغة القديمة (رقم بسيط)
function normalizeEntry(entry){
  if(typeof entry === "number"){
    return { total: entry, values: null };
  }
  return entry;
}

// تقريب رقم إلى منزلتين عشريتين (لتفادي أخطاء الفاصلة العائمة)
function roundScore(n){
  return Math.round(n * 100) / 100;
}

// تنسيق رقم للعرض بمنزلتين عشريتين
function formatScore(n){
  return roundScore(n).toFixed(2);
}

/* =========================================================
   بناء الأسئلة في الصفحة
   ========================================================= */
const questionsContainer = document.getElementById("questionsContainer");

function renderQuestions(){
  questionsContainer.innerHTML = "";

  VALUES.forEach((value, index) => {
    // كتلة القيمة كاملة (سؤال رئيسي + مؤشرات النجاح)
    const block = document.createElement("div");
    block.className = "value-block";
    block.id = `valueBlock${index}`;

    // ---- السؤال الرئيسي ----
    const item = document.createElement("div");
    item.className = "question-item";
    item.id = `qItem${index}`;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = `main_${index}`;
    checkbox.addEventListener("change", () => {
      item.classList.toggle("checked", checkbox.checked);
      updateScore();
    });

    const label = document.createElement("label");
    label.htmlFor = `main_${index}`;
    label.textContent = value.question;

    if(value.reference){
      const refSpan = document.createElement("span");
      refSpan.className = "ref-text";
      refSpan.textContent = value.reference;
      label.appendChild(refSpan);
    }

    item.appendChild(checkbox);
    item.appendChild(label);
    block.appendChild(item);

    // ---- مؤشرات النجاح ----
    const indicatorsBlock = document.createElement("div");
    indicatorsBlock.className = "indicators-block";

    const indicatorsTitle = document.createElement("div");
    indicatorsTitle.className = "indicators-title";
    indicatorsTitle.textContent = "مؤشرات النجاح";
    indicatorsBlock.appendChild(indicatorsTitle);

    value.indicators.forEach((indicatorText, indIndex) => {
      const indItem = document.createElement("div");
      indItem.className = "indicator-item";
      indItem.id = `indItem_${index}_${indIndex}`;

      const indCheckbox = document.createElement("input");
      indCheckbox.type = "checkbox";
      indCheckbox.id = `ind_${index}_${indIndex}`;
      indCheckbox.addEventListener("change", () => {
        indItem.classList.toggle("checked", indCheckbox.checked);
        updateScore();
      });

      const indLabel = document.createElement("label");
      indLabel.htmlFor = `ind_${index}_${indIndex}`;
      indLabel.textContent = indicatorText;

      indItem.appendChild(indCheckbox);
      indItem.appendChild(indLabel);
      indicatorsBlock.appendChild(indItem);
    });

    block.appendChild(indicatorsBlock);
    questionsContainer.appendChild(block);
  });
}

/* =========================================================
   احتساب النقاط وعرضها فورًا
   ========================================================= */
const scoreValueEl = document.getElementById("scoreValue");

// حساب نقاط قيمة واحدة (من 0 إلى 1.75): السؤال الرئيسي + المؤشرات المحددة
function getValueScore(valueIndex){
  let score = 0;

  const mainCheckbox = document.getElementById(`main_${valueIndex}`);
  if(mainCheckbox && mainCheckbox.checked) score += MAIN_POINTS;

  VALUES[valueIndex].indicators.forEach((_, indIndex) => {
    const indCheckbox = document.getElementById(`ind_${valueIndex}_${indIndex}`);
    if(indCheckbox && indCheckbox.checked) score += INDICATOR_POINTS;
  });

  return roundScore(score);
}

// إرجاع مصفوفة نقاط كل القيم الستة (تُستخدم للحفظ ولتحليل المتوسطات)
function getAllValueScores(){
  return VALUES.map((_, index) => getValueScore(index));
}

// المجموع الكلي لكل القيم (من 0 إلى 10.5)
function getCurrentScore(){
  const total = getAllValueScores().reduce((sum, s) => sum + s, 0);
  return roundScore(total);
}

function updateScore(){
  scoreValueEl.textContent = formatScore(getCurrentScore());
}

/* =========================================================
   تحميل تحديدات اليوم الحالي إن كانت محفوظة مسبقًا
   نخزّن حالة السؤال الرئيسي وحالة كل مؤشر نجاح لكل قيمة،
   حتى لا تُفقد التفاصيل عند إعادة فتح الصفحة في نفس اليوم
   ========================================================= */

// مفتاح إضافي لتخزين حالة الأسئلة التفصيلية لليوم الحالي فقط
const TODAY_STATE_KEY = "dailyValuesTracker_todayState";

function loadTodayCheckboxState(){
  try{
    const raw = localStorage.getItem(TODAY_STATE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    // تأكد أن الحالة المحفوظة تخص اليوم الحالي فقط
    if(parsed.date !== getTodayKey()) return null;
    return parsed;
  }catch(e){
    return null;
  }
}

function saveTodayCheckboxState(){
  const main = VALUES.map((_, index) => {
    const checkbox = document.getElementById(`main_${index}`);
    return checkbox ? checkbox.checked : false;
  });

  const indicators = VALUES.map((value, index) => {
    return value.indicators.map((_, indIndex) => {
      const indCheckbox = document.getElementById(`ind_${index}_${indIndex}`);
      return indCheckbox ? indCheckbox.checked : false;
    });
  });

  localStorage.setItem(TODAY_STATE_KEY, JSON.stringify({
    date: getTodayKey(),
    main,
    indicators
  }));
}

function applyTodayCheckboxState(){
  const saved = loadTodayCheckboxState();
  if(!saved) return;

  // تطبيق حالة الأسئلة الرئيسية
  saved.main.forEach((isChecked, index) => {
    const checkbox = document.getElementById(`main_${index}`);
    const item = document.getElementById(`qItem${index}`);
    if(checkbox){
      checkbox.checked = isChecked;
      item.classList.toggle("checked", isChecked);
    }
  });

  // تطبيق حالة مؤشرات النجاح
  saved.indicators.forEach((indArr, index) => {
    indArr.forEach((isChecked, indIndex) => {
      const indCheckbox = document.getElementById(`ind_${index}_${indIndex}`);
      const indItem = document.getElementById(`indItem_${index}_${indIndex}`);
      if(indCheckbox){
        indCheckbox.checked = isChecked;
        indItem.classList.toggle("checked", isChecked);
      }
    });
  });

  updateScore();
}

/* =========================================================
   إظهار الإشعار الصغير
   ========================================================= */
const toastEl = document.getElementById("toast");
let toastTimeout;

function showToast(message){
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 2500);
}

/* =========================================================
   زر الحفظ: يحفظ نتيجة اليوم في localStorage
   ========================================================= */
document.getElementById("saveBtn").addEventListener("click", () => {
  const data = loadData();
  const todayKey = getTodayKey();
  const values = getAllValueScores();          // نقاط كل قيمة على حدة (من 1.75)
  const total = roundScore(values.reduce((sum, s) => sum + s, 0));

  // إنشاء أو تحديث سجل اليوم (يتم التحديث وليس إنشاء نسخة جديدة)
  data[todayKey] = { total, values };
  saveData(data);
  saveTodayCheckboxState();

  showToast("تم حفظ تقييم اليوم بنجاح.");

  renderStats(data);
  renderTable(data);
  drawChart(data);
});

/* =========================================================
   زر إعادة تعيين اليوم: يمسح التحديدات الحالية فقط (بدون حفظ)
   ========================================================= */
document.getElementById("resetTodayBtn").addEventListener("click", () => {
  resetAllCheckboxes();
  updateScore();
  localStorage.removeItem(TODAY_STATE_KEY);
  showToast("تمت إعادة تعيين تحديدات اليوم.");
});

// دالة مشتركة لإلغاء تحديد كل الأسئلة الرئيسية ومؤشرات النجاح في الواجهة
function resetAllCheckboxes(){
  VALUES.forEach((value, index) => {
    const mainCheckbox = document.getElementById(`main_${index}`);
    const item = document.getElementById(`qItem${index}`);
    mainCheckbox.checked = false;
    item.classList.remove("checked");

    value.indicators.forEach((_, indIndex) => {
      const indCheckbox = document.getElementById(`ind_${index}_${indIndex}`);
      const indItem = document.getElementById(`indItem_${index}_${indIndex}`);
      indCheckbox.checked = false;
      indItem.classList.remove("checked");
    });
  });
}

/* =========================================================
   زر مسح جميع البيانات: بعد تأكيد المستخدم
   ========================================================= */
document.getElementById("clearAllBtn").addEventListener("click", () => {
  const confirmed = confirm("هل أنت متأكد من مسح جميع البيانات المحفوظة؟ لا يمكن التراجع عن هذا الإجراء.");
  if(!confirmed) return;

  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(TODAY_STATE_KEY);

  // إعادة تعيين الأسئلة والمؤشرات في الواجهة
  resetAllCheckboxes();
  updateScore();

  const emptyData = {};
  renderStats(emptyData);
  renderTable(emptyData);
  drawChart(emptyData);

  showToast("تم مسح جميع البيانات.");
});

/* =========================================================
   حساب وعرض إحصائيات التقدم
   ========================================================= */
function renderStats(data){
  // توحيد كل الإدخالات (تدعم الصيغة القديمة والجديدة)
  const entries = Object.entries(data).map(([dateKey, entry]) => [dateKey, normalizeEntry(entry)]);

  const totalDays = entries.length;
  const totalPoints = entries.reduce((sum, [, e]) => sum + e.total, 0);
  const avg = totalDays > 0 ? totalPoints / totalDays : 0;
  const best = totalDays > 0 ? Math.max(...entries.map(([, e]) => e.total)) : 0;
  const fullDays = entries.filter(([, e]) => Math.abs(e.total - MAX_TOTAL) < 0.001).length;

  document.getElementById("statDays").textContent = totalDays;
  document.getElementById("statTotalPoints").textContent = formatScore(totalPoints);
  document.getElementById("statAvg").textContent = formatScore(avg);
  document.getElementById("statBest").textContent = formatScore(best);
  document.getElementById("statFullDays").textContent = fullDays;

  renderValueAverages(entries);
}

// عرض جدول متوسط كل قيمة على حدة عبر كل الأيام المسجلة
function renderValueAverages(entries){
  const container = document.getElementById("valueAveragesContainer");

  // نأخذ فقط الأيام التي تحتوي على تفصيل نقاط القيم (values غير null)
  const detailedEntries = entries.filter(([, e]) => Array.isArray(e.values));

  if(detailedEntries.length === 0){
    container.innerHTML = `<div class="empty-state">لا توجد بيانات كافية لعرض تحليل القيم بعد.</div>`;
    return;
  }

  // حساب متوسط كل قيمة (بنفس ترتيب مصفوفة VALUES)
  const averages = VALUES.map((_, valueIndex) => {
    const sum = detailedEntries.reduce((acc, [, e]) => acc + (e.values[valueIndex] || 0), 0);
    return sum / detailedEntries.length;
  });

  let html = `
    <table>
      <thead>
        <tr>
          <th>القيمة</th>
          <th>المتوسط</th>
        </tr>
      </thead>
      <tbody>
  `;

  VALUES.forEach((value, index) => {
    html += `
      <tr>
        <td>${value.title}</td>
        <td>${formatScore(averages[index])} / ${MAX_PER_VALUE.toFixed(2)}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

/* =========================================================
   عرض جدول سجل الأيام (من الأحدث إلى الأقدم)
   ========================================================= */
function renderTable(data){
  const container = document.getElementById("tableContainer");
  const entries = Object.entries(data)
    .map(([dateKey, entry]) => [dateKey, normalizeEntry(entry)])
    .sort((a, b) => b[0].localeCompare(a[0]));

  if(entries.length === 0){
    container.innerHTML = `<div class="empty-state">لا توجد أيام مسجلة بعد.</div>`;
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>النقاط</th>
        </tr>
      </thead>
      <tbody>
  `;

  entries.forEach(([dateKey, e]) => {
    html += `
      <tr>
        <td>${dateKey}</td>
        <td>${formatScore(e.total)} / 10.5</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

/* =========================================================
   رسم بياني بسيط باستخدام Canvas API (أعمدة) بدون مكتبات
   ========================================================= */
function drawChart(data){
  const canvas = document.getElementById("progressChart");
  const ctx = canvas.getContext("2d");

  // ضبط دقة العرض حسب حجم الشاشة الفعلي
  const displayWidth = canvas.clientWidth;
  const displayHeight = 180;
  canvas.width = displayWidth * window.devicePixelRatio;
  canvas.height = displayHeight * window.devicePixelRatio;
  canvas.style.height = displayHeight + "px";
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // تفريغ الرسم
  ctx.clearRect(0, 0, displayWidth, displayHeight);

  const entries = Object.entries(data)
    .map(([dateKey, entry]) => [dateKey, normalizeEntry(entry)])
    .sort((a, b) => a[0].localeCompare(b[0]));

  if(entries.length === 0){
    ctx.fillStyle = "#999";
    ctx.font = "14px Cairo, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("لا توجد بيانات لعرضها بعد", displayWidth / 2, displayHeight / 2);
    return;
  }

  const padding = 30;
  const chartWidth = displayWidth - padding * 2;
  const chartHeight = displayHeight - padding * 2;
  const maxScore = MAX_TOTAL; // 10.5
  const gridSteps = 6; // نفس عدد القيم، لتكون كل خط بمقدار 1.75

  // عدد الأعمدة المعروضة (آخر 14 يومًا كحد أقصى لوضوح الرسم)
  const visibleEntries = entries.slice(-14);
  const barSpacing = chartWidth / visibleEntries.length;
  const barWidth = Math.min(barSpacing * 0.6, 30);

  // رسم خطوط الشبكة الأفقية (0 إلى 10.5 على 6 مستويات)
  ctx.strokeStyle = "#E5E5E0";
  ctx.fillStyle = "#888";
  ctx.font = "10px Cairo, sans-serif";
  ctx.textAlign = "right";

  for(let i = 0; i <= gridSteps; i++){
    const value = (i / gridSteps) * maxScore;
    const y = padding + chartHeight - (value / maxScore) * chartHeight;
    ctx.beginPath();
    ctx.moveTo(padding, y);
    ctx.lineTo(displayWidth - padding, y);
    ctx.stroke();
    ctx.fillText(value.toFixed(1), padding - 6, y + 3);
  }

  // رسم الأعمدة
  visibleEntries.forEach(([dateKey, e], index) => {
    const score = e.total;
    const barHeight = (score / maxScore) * chartHeight;
    const x = padding + index * barSpacing + (barSpacing - barWidth) / 2;
    const y = padding + chartHeight - barHeight;

    // لون العمود: أخضر أساسي، وذهبي لليوم الكامل (10.5/10.5)
    ctx.fillStyle = Math.abs(score - maxScore) < 0.001 ? "#C9A227" : "#1F6F5F";
    ctx.fillRect(x, y, barWidth, barHeight);

    // تسمية اليوم/الشهر أسفل كل عمود
    ctx.save();
    ctx.fillStyle = "#666";
    ctx.font = "9px Cairo, sans-serif";
    ctx.textAlign = "center";
    const shortLabel = dateKey.slice(5); // MM-DD
    ctx.fillText(shortLabel, x + barWidth / 2, displayHeight - padding + 14);
    ctx.restore();
  });
}

/* =========================================================
   تهيئة الصفحة عند التحميل
   ========================================================= */
function init(){
  // عرض تاريخ اليوم
  document.getElementById("todayDate").textContent = formatArabicDate(new Date());

  // بناء الأسئلة
  renderQuestions();

  // تحميل تحديدات اليوم إن وجدت
  applyTodayCheckboxState();

  // تحميل البيانات المحفوظة وعرض الإحصائيات والجدول والرسم
  const data = loadData();
  renderStats(data);
  renderTable(data);
  drawChart(data);

  // إعادة رسم الرسم البياني عند تغيير حجم الشاشة
  window.addEventListener("resize", () => {
    drawChart(loadData());
  });
}

init();
