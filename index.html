<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القيم اليومية</title>

<style>
  /* ============ إعدادات عامة ============ */
  :root{
    --bg:#F7F7F5;
    --text:#1F2937;
    --primary:#1F6F5F;
    --primary-dark:#164f43;
    --gold:#C9A227;
    --card-bg:#FFFFFF;
    --border:#E5E5E0;
    --danger:#B94A48;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 12px;
    line-height:1.6;
  }

  /* ============ البطاقة الرئيسية ============ */
  .card{
    background:var(--card-bg);
    width:100%;
    max-width:620px;
    border-radius:18px;
    padding:28px 22px 32px;
    box-shadow:0 6px 24px rgba(0,0,0,0.06);
    border:1px solid var(--border);
  }

  header{
    text-align:center;
    margin-bottom:18px;
  }

  header h1{
    color:var(--primary-dark);
    font-size:1.7rem;
    margin-bottom:6px;
  }

  header p.subtitle{
    color:#555;
    font-size:0.95rem;
  }

  .today-date{
    text-align:center;
    color:var(--gold);
    font-weight:700;
    font-size:0.95rem;
    margin:10px 0 20px;
    background:#fbf6e6;
    border:1px solid #efe2b3;
    border-radius:10px;
    padding:8px;
  }

  /* ============ الأسئلة ============ */
  .questions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }

  .question-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    transition:background .2s, border-color .2s;
  }

  .question-item.checked{
    background:#eaf5f1;
    border-color:var(--primary);
  }

  .question-item input[type="checkbox"]{
    width:22px;
    height:22px;
    accent-color:var(--primary);
    cursor:pointer;
    flex-shrink:0;
  }

  .question-item label{
    cursor:pointer;
    font-size:1rem;
    flex:1;
  }

  /* ============ عرض النقاط ============ */
  .score-box{
    text-align:center;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
  }

  .score-box .score-value{
    font-size:2.4rem;
    font-weight:800;
  }

  .score-box .score-label{
    font-size:0.95rem;
    opacity:0.9;
    margin-top:4px;
  }

  /* ============ الأزرار ============ */
  .btn{
    display:inline-block;
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:opacity .2s, transform .1s;
  }
  .btn:active{ transform:scale(0.98); }

  .btn-primary{
    background:var(--primary);
    color:#fff;
    margin-bottom:12px;
  }
  .btn-primary:hover{ background:var(--primary-dark); }

  .small-buttons{
    display:flex;
    gap:10px;
    margin-bottom:6px;
  }

  .btn-secondary{
    background:#fff;
    color:var(--primary-dark);
    border:1.5px solid var(--primary);
    flex:1;
    font-size:0.9rem;
    padding:10px;
  }
  .btn-secondary:hover{ background:#eaf5f1; }

  .btn-danger{
    background:#fff;
    color:var(--danger);
    border:1.5px solid var(--danger);
    flex:1;
    font-size:0.9rem;
    padding:10px;
  }
  .btn-danger:hover{ background:#fbeceb; }

  /* ============ الإشعار ============ */
  #toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--primary-dark);
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-size:0.95rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:999;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ============ قسم التقدم ============ */
  .section-title{
    color:var(--primary-dark);
    font-size:1.25rem;
    margin:30px 0 14px;
    border-bottom:2px solid var(--gold);
    display:inline-block;
    padding-bottom:4px;
  }

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }

  .stat-card{
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }

  .stat-card .stat-value{
    font-size:1.4rem;
    font-weight:800;
    color:var(--primary-dark);
  }

  .stat-card .stat-label{
    font-size:0.8rem;
    color:#666;
    margin-top:2px;
  }

  /* ============ الرسم البياني ============ */
  canvas{
    width:100%;
    max-width:100%;
    background:#fafaf8;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:20px;
    display:block;
  }

  /* ============ جدول السجل ============ */
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:10px;
    font-size:0.92rem;
  }

  th, td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }

  th{
    background:#eaf5f1;
    color:var(--primary-dark);
  }

  tr:hover td{ background:#fafaf8; }

  .empty-state{
    text-align:center;
    color:#888;
    padding:16px;
    font-size:0.9rem;
  }

  footer{
    text-align:center;
    color:#999;
    font-size:0.78rem;
    margin-top:22px;
  }

  @media (max-width:480px){
    header h1{ font-size:1.4rem; }
    .score-box .score-value{ font-size:2rem; }
    .stats-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="card">

  <header>
    <h1>اختبار القيم اليومية</h1>
    <p class="subtitle">قبل أي قرار مهم أسأل نفسي:</p>
  </header>

  <!-- عرض تاريخ اليوم -->
  <div class="today-date" id="todayDate"></div>

  <!-- الأسئلة الستة -->
  <div class="questions" id="questionsContainer"></div>

  <!-- عرض النقاط -->
  <div class="score-box">
    <div class="score-value"><span id="scoreValue">0</span> / 6</div>
    <div class="score-label">نقاط اليوم</div>
  </div>

  <!-- زر الحفظ -->
  <button class="btn btn-primary" id="saveBtn">حفظ تقييم اليوم</button>

  <!-- أزرار إضافية -->
  <div class="small-buttons">
    <button class="btn btn-secondary" id="resetTodayBtn">إعادة تعيين اليوم</button>
    <button class="btn btn-danger" id="clearAllBtn">مسح جميع البيانات</button>
  </div>

  <!-- قسم التقدم -->
  <h2 class="section-title">تطوري</h2>
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-value" id="statDays">0</div>
      <div class="stat-label">إجمالي الأيام المسجلة</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTotalPoints">0</div>
      <div class="stat-label">إجمالي النقاط</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statAvg">0</div>
      <div class="stat-label">متوسط النقاط اليومي</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statBest">0</div>
      <div class="stat-label">أفضل يوم</div>
    </div>
    <div class="stat-card" style="grid-column:1 / -1;">
      <div class="stat-value" id="statFullDays">0</div>
      <div class="stat-label">عدد الأيام الكاملة (6/6)</div>
    </div>
  </div>

  <!-- الرسم البياني -->
  <canvas id="progressChart" height="180"></canvas>

  <!-- سجل الأيام -->
  <h2 class="section-title">سجل الأيام</h2>
  <div id="tableContainer"></div>

  <footer>يتم حفظ جميع بياناتك محليًا في متصفحك فقط.</footer>
</div>

<!-- عنصر الإشعار -->
<div id="toast"></div>

<script>
/* =========================================================
   قائمة الأسئلة - يمكن إضافة/حذف/تعديل أي سؤال من هنا بسهولة
   ========================================================= */
const QUESTIONS = [
  "هل يضع هذا يسوع أولًا؟",
  "هل أتحمل مسؤوليته كاملة؟",
  "هل يعكس نزاهة وإتقانًا؟",
  "هل أستطيع قوله بصراحة ومحبة؟",
  "هل يخدم الناس بتواضع؟",
  "هل يساعدني على التعلّم والنمو؟"
];

const STORAGE_KEY = "dailyValuesTracker"; // مفتاح التخزين في localStorage

/* =========================================================
   أدوات مساعدة للتاريخ
   ========================================================= */

// إرجاع مفتاح اليوم بصيغة YYYY-MM-DD
function getTodayKey(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// تنسيق التاريخ بالعربية (مثل: الثلاثاء، 4 أغسطس 2026)
function formatArabicDate(date = new Date()){
  const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                   "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const dayName = days[date.getDay()];
  const monthName = months[date.getMonth()];
  return `${dayName}، ${date.getDate()} ${monthName} ${date.getFullYear()}`;
}

/* =========================================================
   إدارة التخزين المحلي (localStorage)
   شكل البيانات: { "2026-08-04": 5, "2026-08-05": 6, ... }
   ========================================================= */

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    console.error("خطأ في قراءة البيانات المحفوظة:", e);
    return {};
  }
}

function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* =========================================================
   بناء الأسئلة في الصفحة
   ========================================================= */
const questionsContainer = document.getElementById("questionsContainer");

function renderQuestions(){
  questionsContainer.innerHTML = "";
  QUESTIONS.forEach((questionText, index) => {
    const item = document.createElement("div");
    item.className = "question-item";
    item.id = `qItem${index}`;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = `q${index}`;
    checkbox.addEventListener("change", () => {
      item.classList.toggle("checked", checkbox.checked);
      updateScore();
    });

    const label = document.createElement("label");
    label.htmlFor = `q${index}`;
    label.textContent = questionText;

    item.appendChild(checkbox);
    item.appendChild(label);
    questionsContainer.appendChild(item);
  });
}

/* =========================================================
   احتساب النقاط وعرضها فورًا
   ========================================================= */
const scoreValueEl = document.getElementById("scoreValue");

function getCurrentScore(){
  let score = 0;
  QUESTIONS.forEach((_, index) => {
    const checkbox = document.getElementById(`q${index}`);
    if (checkbox && checkbox.checked) score++;
  });
  return score;
}

function updateScore(){
  scoreValueEl.textContent = getCurrentScore();
}

/* =========================================================
   تحميل تحديدات اليوم الحالي إن كانت محفوظة مسبقًا
   (يتم استنتاج عدد الأسئلة فقط من النقاط، لذلك نعرض
   النقاط المحفوظة كأول N أسئلة محددة تقريبًا - لكن الأصح
   تخزين حالة كل سؤال. سنحسّن ذلك بتخزين حالة الأسئلة أيضًا)
   ========================================================= */

// مفتاح إضافي لتخزين حالة الأسئلة التفصيلية لليوم الحالي فقط
const TODAY_STATE_KEY = "dailyValuesTracker_todayState";

function loadTodayCheckboxState(){
  try{
    const raw = localStorage.getItem(TODAY_STATE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    // تأكد أن الحالة المحفوظة تخص اليوم الحالي فقط
    if(parsed.date !== getTodayKey()) return null;
    return parsed.checks;
  }catch(e){
    return null;
  }
}

function saveTodayCheckboxState(){
  const checks = QUESTIONS.map((_, index) => {
    const checkbox = document.getElementById(`q${index}`);
    return checkbox ? checkbox.checked : false;
  });
  localStorage.setItem(TODAY_STATE_KEY, JSON.stringify({
    date: getTodayKey(),
    checks
  }));
}

function applyTodayCheckboxState(){
  const savedChecks = loadTodayCheckboxState();
  if(!savedChecks) return;
  savedChecks.forEach((isChecked, index) => {
    const checkbox = document.getElementById(`q${index}`);
    const item = document.getElementById(`qItem${index}`);
    if(checkbox){
      checkbox.checked = isChecked;
      item.classList.toggle("checked", isChecked);
    }
  });
  updateScore();
}

/* =========================================================
   إظهار الإشعار الصغير
   ========================================================= */
const toastEl = document.getElementById("toast");
let toastTimeout;

function showToast(message){
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 2500);
}

/* =========================================================
   زر الحفظ: يحفظ نتيجة اليوم في localStorage
   ========================================================= */
document.getElementById("saveBtn").addEventListener("click", () => {
  const data = loadData();
  const todayKey = getTodayKey();
  const score = getCurrentScore();

  data[todayKey] = score; // إنشاء أو تحديث القيمة الخاصة باليوم
  saveData(data);
  saveTodayCheckboxState();

  showToast("تم حفظ تقييم اليوم بنجاح.");

  renderStats(data);
  renderTable(data);
  drawChart(data);
});

/* =========================================================
   زر إعادة تعيين اليوم: يمسح التحديدات الحالية فقط (بدون حفظ)
   ========================================================= */
document.getElementById("resetTodayBtn").addEventListener("click", () => {
  QUESTIONS.forEach((_, index) => {
    const checkbox = document.getElementById(`q${index}`);
    const item = document.getElementById(`qItem${index}`);
    checkbox.checked = false;
    item.classList.remove("checked");
  });
  updateScore();
  localStorage.removeItem(TODAY_STATE_KEY);
  showToast("تمت إعادة تعيين تحديدات اليوم.");
});

/* =========================================================
   زر مسح جميع البيانات: بعد تأكيد المستخدم
   ========================================================= */
document.getElementById("clearAllBtn").addEventListener("click", () => {
  const confirmed = confirm("هل أنت متأكد من مسح جميع البيانات المحفوظة؟ لا يمكن التراجع عن هذا الإجراء.");
  if(!confirmed) return;

  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(TODAY_STATE_KEY);

  // إعادة تعيين الأسئلة في الواجهة
  QUESTIONS.forEach((_, index) => {
    const checkbox = document.getElementById(`q${index}`);
    const item = document.getElementById(`qItem${index}`);
    checkbox.checked = false;
    item.classList.remove("checked");
  });
  updateScore();

  const emptyData = {};
  renderStats(emptyData);
  renderTable(emptyData);
  drawChart(emptyData);

  showToast("تم مسح جميع البيانات.");
});

/* =========================================================
   حساب وعرض إحصائيات التقدم
   ========================================================= */
function renderStats(data){
  const entries = Object.entries(data); // [ [date, score], ... ]
  const totalDays = entries.length;
  const totalPoints = entries.reduce((sum, [, score]) => sum + score, 0);
  const avg = totalDays > 0 ? (totalPoints / totalDays).toFixed(1) : "0";
  const best = totalDays > 0 ? Math.max(...entries.map(([, score]) => score)) : 0;
  const fullDays = entries.filter(([, score]) => score === 6).length;

  document.getElementById("statDays").textContent = totalDays;
  document.getElementById("statTotalPoints").textContent = totalPoints;
  document.getElementById("statAvg").textContent = avg;
  document.getElementById("statBest").textContent = best;
  document.getElementById("statFullDays").textContent = fullDays;
}

/* =========================================================
   عرض جدول سجل الأيام (من الأحدث إلى الأقدم)
   ========================================================= */
function renderTable(data){
  const container = document.getElementById("tableContainer");
  const entries = Object.entries(data).sort((a, b) => b[0].localeCompare(a[0]));

  if(entries.length === 0){
    container.innerHTML = `<div class="empty-state">لا توجد أيام مسجلة بعد.</div>`;
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>النقاط</th>
        </tr>
      </thead>
      <tbody>
  `;

  entries.forEach(([dateKey, score]) => {
    html += `
      <tr>
        <td>${dateKey}</td>
        <td>${score} / 6</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

/* =========================================================
   رسم بياني بسيط باستخدام Canvas API (أعمدة) بدون مكتبات
   ========================================================= */
function drawChart(data){
  const canvas = document.getElementById("progressChart");
  const ctx = canvas.getContext("2d");

  // ضبط دقة العرض حسب حجم الشاشة الفعلي
  const displayWidth = canvas.clientWidth;
  const displayHeight = 180;
  canvas.width = displayWidth * window.devicePixelRatio;
  canvas.height = displayHeight * window.devicePixelRatio;
  canvas.style.height = displayHeight + "px";
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // تفريغ الرسم
  ctx.clearRect(0, 0, displayWidth, displayHeight);

  const entries = Object.entries(data).sort((a, b) => a[0].localeCompare(b[0]));

  if(entries.length === 0){
    ctx.fillStyle = "#999";
    ctx.font = "14px Cairo, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("لا توجد بيانات لعرضها بعد", displayWidth / 2, displayHeight / 2);
    return;
  }

  const padding = 30;
  const chartWidth = displayWidth - padding * 2;
  const chartHeight = displayHeight - padding * 2;
  const maxScore = 6;

  // عدد الأعمدة المعروضة (آخر 14 يومًا كحد أقصى لوضوح الرسم)
  const visibleEntries = entries.slice(-14);
  const barSpacing = chartWidth / visibleEntries.length;
  const barWidth = Math.min(barSpacing * 0.6, 30);

  // رسم خطوط الشبكة الأفقية (0 إلى 6)
  ctx.strokeStyle = "#E5E5E0";
  ctx.fillStyle = "#888";
  ctx.font = "10px Cairo, sans-serif";
  ctx.textAlign = "right";

  for(let i = 0; i <= maxScore; i++){
    const y = padding + chartHeight - (i / maxScore) * chartHeight;
    ctx.beginPath();
    ctx.moveTo(padding, y);
    ctx.lineTo(displayWidth - padding, y);
    ctx.stroke();
    ctx.fillText(i, padding - 6, y + 3);
  }

  // رسم الأعمدة
  visibleEntries.forEach(([dateKey, score], index) => {
    const barHeight = (score / maxScore) * chartHeight;
    const x = padding + index * barSpacing + (barSpacing - barWidth) / 2;
    const y = padding + chartHeight - barHeight;

    // لون العمود: أخضر أساسي، وذهبي لليوم الكامل (6/6)
    ctx.fillStyle = score === 6 ? "#C9A227" : "#1F6F5F";
    ctx.fillRect(x, y, barWidth, barHeight);

    // تسمية اليوم/الشهر أسفل كل عمود
    ctx.save();
    ctx.fillStyle = "#666";
    ctx.font = "9px Cairo, sans-serif";
    ctx.textAlign = "center";
    const shortLabel = dateKey.slice(5); // MM-DD
    ctx.fillText(shortLabel, x + barWidth / 2, displayHeight - padding + 14);
    ctx.restore();
  });
}

/* =========================================================
   تهيئة الصفحة عند التحميل
   ========================================================= */
function init(){
  // عرض تاريخ اليوم
  document.getElementById("todayDate").textContent = formatArabicDate(new Date());

  // بناء الأسئلة
  renderQuestions();

  // تحميل تحديدات اليوم إن وجدت
  applyTodayCheckboxState();

  // تحميل البيانات المحفوظة وعرض الإحصائيات والجدول والرسم
  const data = loadData();
  renderStats(data);
  renderTable(data);
  drawChart(data);

  // إعادة رسم الرسم البياني عند تغيير حجم الشاشة
  window.addEventListener("resize", () => {
    drawChart(loadData());
  });
}

init();
</script>

</body>
</html>
